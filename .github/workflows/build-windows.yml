name: Build Windows app

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build executable
        shell: cmd
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name "Epson EcoTank ID Converter"
          --add-data "template_base;template_base"
          --collect-all pymupdf main.py
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Epson-EcoTank-ID-Converter-Windows
          path: dist/Epson EcoTank ID Converter.exe
          if-no-files-found: error
      - name: Publish downloadable Windows release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-latest"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Epson EcoTank ID Converter for Windows" --notes "Standalone Windows application. No Python or Poppler installation is required."
          }
          gh release upload $tag "dist/Epson EcoTank ID Converter.exe" --clobber
